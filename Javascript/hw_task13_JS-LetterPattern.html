<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Patterns</title>
</head>
<body>
    <script>
        for (let j = 1; j <= 7; j++) {
            for (let i = 1; i <= 5; i++) {
                if (i == 1 || j == 1 || j == 4 ||
                    (i == 5 && j >= 4) || j == 7) {
                    document.write("*");
                } else {
                    document.write("&nbsp;&nbsp;");
                }
            }
            document.write("<br>");
        }
        document.write("<br><br>");
        // Pattern 2
        for (let j = 1; j <= 9; j++) {
            for (let i = 1; i <= 9; i++) {
                if (j == 5 || i == 5 ||
                    (i == 1 && j <= 5) ||
                    (i == 9 && j >= 5) ||
                    (j == 1 && i >= 5) ||
                    (j == 9 && i <= 5)) {
                    document.write("*");
                } else {
                    document.write("&nbsp;&nbsp;");
                }
            }
            document.write("<br>");
        }
    </script>
</body>
</html>
